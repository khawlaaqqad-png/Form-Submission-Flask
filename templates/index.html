<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="text-center mb-0">Dojo Survey</h4>
                    </div>
                    <div class="card-body">
                        <form action="/result" method="POST">

                            <!-- Name (label + input in same row) -->
                            <div class="row mb-3 align-items-center">
                                <label for="name" class="col-sm-3 col-form-label fw-bold">Your Name:</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="name" name="your_name" required>
                                </div>
                            </div>

                            <!-- Location -->
                            <div class="row mb-3 align-items-center">
                                <label for="location" class="col-sm-3 col-form-label fw-bold">Dojo Location:</label>
                                <div class="col-sm-9">
                                    <select class="form-select" id="location" name="location">
                                        <option value="San Jose">San Jose</option>
                                        <option value="Seattle">Seattle</option>
                                        <option value="Dallas">Dallas</option>
                                        <option value="Chicago">Chicago</option>
                                        <option value="Online">Online</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Language (Radio) -->
                            <div class="row mb-3 align-items-center">
                                <label for="Language" class="col-sm-3 col-form-label fw-bold">Favorite Language:</label>
                                <div class="col-sm-9">
                                    <select class="form-select" id="Language" name="Language">
                                        <option value="python">python</option>
                                        <option value="javascript">javascript</option>
                                        <option value="css">css</option>
                                        <option value="html">html</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Comment -->
                            <div class="row mb-3 align-items-start">
                                <label for="comment" class="col-sm-3 col-form-label fw-bold">Comment:</label>
                                <div class="col-sm-9">
                                    <textarea class="form-control" id="comment" name="comment" rows="3"></textarea>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="row">
                                <div class="col-sm-9 offset-sm-3">
                                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
